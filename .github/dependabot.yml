# Dependabot configuration.
#
# Security updates work without this file, which is why the repo has merged
# Dependabot security PRs (#1, #2, #11) despite never having one. *Version*
# updates require explicit config, so routine dependency bumps were never
# being opened — the Go module set only moved when a CVE forced it.
#
# Grouped so a week's patch bumps arrive as one reviewable PR rather than a
# stream of near-identical ones.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "build(deps)"

  # The workflows pin every action to a commit SHA with its release as a
  # trailing comment; Dependabot moves the SHA and the comment together.
  # Without this the pins silently rot until an action is deprecated and CI
  # breaks. The week's cooldown means a hijacked release is usually caught and
  # pulled before it is proposed here. Dependabot does not update the image
  # digests in release-docker.yml; its header says how to bump those.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # Everything release-docker.yml's token-holding jobs run comes as its
      # own PR. A dependency joins the first group it matches.
      release-actions:
        patterns:
          - "docker/*"
          - "actions/checkout"
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # Dockerfile and Dockerfile.caddy base images. Weekly rather than monthly
  # because this is the only automation that moves `caddy:2.11.x-builder` and
  # `caddy:2.11.x-alpine`: Dockerfile.caddy's own `apk upgrade --no-cache`
  # refreshes the Alpine packages inside the pinned base, but nothing moves the
  # pin itself, so a new Caddy patch release sat unproposed for as long as the
  # interval. caddy-image-refresh.yml rebuilds and scans weekly on the same
  # day, so a human reviewing one is looking at the other's result too.
  #
  # Grouped for the same reason as the Go bumps — the two base images move in
  # lockstep and are one decision, not two PRs. The week's cooldown means a
  # bad base-image release is usually pulled before it is proposed here.
  # Dependabot does not touch the digest-pinned BuildKit, binfmt or SBOM
  # scanner images in release-docker.yml; that file's header says how.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      caddy-base-images:
        patterns:
          - "caddy"
      docker-base-images:
        patterns:
          - "*"
    commit-message:
      prefix: "build(docker)"
