# Dependabot configuration.
#
# Security updates work without this file, which is why the repo has merged
# Dependabot security PRs (#1, #2, #11) despite never having one. *Version*
# updates require explicit config, so routine dependency bumps were never
# being opened — the Go module set only moved when a CVE forced it.
#
# Grouped so a week's patch bumps arrive as one reviewable PR rather than a
# stream of near-identical ones.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "build(deps)"

  # The workflows pin every action to a commit SHA with its release as a
  # trailing comment; Dependabot moves the SHA and the comment together.
  # Without this the pins silently rot until an action is deprecated and CI
  # breaks. The week's cooldown means a hijacked release is usually caught and
  # pulled before it is proposed here. Dependabot does not update the image
  # digests in release-docker.yml; its header says how to bump those.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # Everything release-docker.yml's token-holding jobs run comes as its
      # own PR. A dependency joins the first group it matches.
      release-actions:
        patterns:
          - "docker/*"
          - "actions/checkout"
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(docker)"
