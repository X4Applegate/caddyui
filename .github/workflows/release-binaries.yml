name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: Build release archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          # On a tag this is v2.68.6. On a manual run from a branch it is the
          # branch name, which may contain `/` — that would turn the archive
          # name into a nested path and break the `tar -C dist` below.
          version="${GITHUB_REF_NAME:-manual}"
          version="${version//\//-}"
          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "${target}"
            name="caddyui_${version}_${goos}_${goarch}"
            outdir="dist/${name}"
            mkdir -p "${outdir}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=${version}" \
              -o "${outdir}/caddyui" \
              ./cmd/caddyui

            cp README.md CHANGELOG.md LICENSE "${outdir}/"
            cp packaging/systemd/caddyui.service "${outdir}/caddyui.service"
            cp packaging/install.sh "${outdir}/install.sh"
            chmod 0755 "${outdir}/install.sh"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          done

          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caddyui-binaries
          path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
