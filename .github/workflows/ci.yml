name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is checked before the slower steps so a whitespace-only
      # failure reports in seconds. Four files had drifted out of gofmt before
      # this gate existed, which is easy to do when nothing enforces it.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./web)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ./cmd ./internal ./web"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build binary
        run: go build ./cmd/caddyui

  # The release workflow's plan job decides, in shell, which names may publish
  # and which ref the build jobs check out. That logic protects :stable and
  # :latest on both images and is not covered by `go test`, so it gets its own
  # guard here (T-0755). The test extracts the step straight out of
  # release-docker.yml rather than restating it, so the two cannot drift.
  #
  # It needs no Go toolchain, no services and no release credentials: it builds
  # throwaway git repositories in $TMPDIR and runs the extracted script against
  # them. A shallow checkout is therefore fine.
  workflow-guards:
    name: Release workflow guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every script in scripts/ passes `shellcheck -S warning`, and that was
      # an unenforced convention until now: nothing checked it, so the one
      # script that broke it (SC1007, caught in review) would have reached main
      # green. Lint the directory, not just the extracted step, so the
      # invariant is a gate rather than a habit.
      - name: Shellcheck scripts/
        run: shellcheck -S warning scripts/*.sh

      - name: Lint the release workflow's plan script
        run: |
          python3 - .github/workflows/release-docker.yml /tmp/plan-step.sh <<'PY'
          import sys, yaml
          wf, out = sys.argv[1], sys.argv[2]
          steps = [s for s in yaml.safe_load(open(wf))["jobs"]["plan"]["steps"]
                   if s.get("id") == "p"]
          if len(steps) != 1:
              sys.exit(f"expected one plan step with id 'p', found {len(steps)}")
          open(out, "w").write("#!/usr/bin/env bash\n" + steps[0]["run"])
          PY
          shellcheck -S warning /tmp/plan-step.sh

      - name: Only release TAGS may publish, and the built ref must be that tag
        run: ./scripts/test-release-plan-version-input.sh

      # The base-drift check reports whether a release that SKIPPED the Caddy rebuild
      # shipped a stale base. Its only failure mode is a reassuring answer it was not
      # entitled to give, so the suite asserts the shape of the wrong answers -- never
      # `unchanged` when it could not compare, never a silent amd64-only comparison. Stubs
      # the registry; no network access.
      - name: The base-drift check never reports an unearned all-clear
        run: ./scripts/test-caddy-base-drift.sh

      # The caddy-image-gate.sh regression suites (T-0821).
      #
      # That script decides whether a rebuilt image may replace the published
      # one and move `:stable`/`:latest` on six public-facing edge proxies, and
      # until this step existed NONE of its suites was run by any workflow --
      # `shellcheck` above was the only automated thing reaching the file. Every
      # assertion in the gate is a REFUSAL that fires only on a malicious or
      # degraded input, so removing one leaves the happy path green and nothing
      # notices. T-0812 is a live instance: replacing check 4's floor with
      # `if false` still produced a fully passing run, because nothing isolated
      # it. A regression test nobody runs is a regression test that does not
      # exist.
      #
      # These are scan-level and string-level: no Docker, no network, all
      # in a few seconds, which is why they sit in this job
      # rather than a new one. `workflow-guards` already exists for exactly this
      # shape of check -- shell suites needing no Go toolchain, no services and
      # no credentials -- so extending it adds no runner and no checkout.
      #
      # NOT RUN HERE: the `pinned-module-*` sweeps pull real images and call
      # proxy.golang.org, OSV and GitHub. Those are wired separately by T-0712
      # (offline half on PRs, network half on the weekly refresh) and must not
      # be folded in here, where three external services could turn a review red
      # for a reason unrelated to the change under review.
      - name: Image-gate regression suites
        run: |
          # Named explicitly rather than globbed. A glob over
          # scripts/test-caddy-image-gate-*.sh would quietly run a suite that
          # later acquires a Docker or network dependency on every PR, and -
          # worse for a guard - would report success for an EMPTY match if the
          # files were ever renamed. An absent suite must be a hard error, not
          # zero iterations of a loop.
          suites=(
            test-caddy-image-gate-fs-allow.sh    # FS_ALLOW_RE validation, 52 cases
            test-caddy-image-gate-trust-env.sh   # TLS-trust env rules, 40 cases
            test-image-gate-coverage.sh          # scan-coverage floors (T-0638/T-0809), crafted Trivy JSON
          )

          for s in "${suites[@]}"; do
            [ -x "scripts/$s" ] || {
              echo "::error::scripts/$s is missing or not executable; the gate is unguarded on this ref"
              exit 1
            }
          done

          # Every suite runs even after one fails: they are independent, and
          # `set -e` here would report the first failure while hiding the rest.
          rc=0
          for s in "${suites[@]}"; do
            echo "::group::$s"
            ./"scripts/$s" || { rc=1; echo "::error::$s failed"; }
            echo "::endgroup::"
          done
          exit "$rc"

      # A suite on disk that no step runs is the exact failure this card fixed,
      # and it would come back silently the next time one is added: the step
      # above would still be green, having simply not run the new file. So the
      # list is cross-checked against the tree. This is a guard on the guard;
      # it costs milliseconds and removes the only way this regression recurs.
      - name: Every image-gate suite on disk is actually run
        run: |
          missing=0
          for f in scripts/test-caddy-image-gate-*.sh scripts/test-image-gate-*.sh; do
            [ -e "$f" ] || continue
            b="$(basename "$f")"
            grep -q "$b" .github/workflows/ci.yml || {
              echo "::error::$b exists but is not run by ci.yml; add it to the Image-gate regression suites step"
              missing=1
            }
          done
          exit "$missing"

  # govulncheck is here for ONE property nothing else in this repo reports:
  # REACHABILITY. It distinguishes an advisory against a linked module from one
  # against a function this code actually calls, and on its first run it found
  # a *called* stdlib finding (GO-2026-6859, in `http.maxBytesReader`) that
  # neither Dependabot nor the image gate can see -- Dependabot does not track
  # the toolchain, and the image gate compares against the previous image
  # rather than upstream.
  #
  # WHAT IT IS NOT. It is NOT the fix for the CVE-less advisory gap, and must
  # not be read as one. `vuln.go.dev` is CVE-keyed like OSV and like GitHub's
  # global index, and measured against it govulncheck reports NONE of the five
  # CVE-less go-jose advisories that were live in this module set. That gap is
  # closed by `scripts/check-pinned-modules.sh --gomod`, on GitHub's
  # per-repository endpoint. Two checks, two different blind spots; neither
  # substitutes for the other, and a green run here is not evidence about
  # CVE-less advisories.
  #
  # REPORT-ONLY, DELIBERATELY. A called finding in the stdlib is fixed by a
  # toolchain bump, which is not always available the moment the advisory
  # lands -- GO-2026-6859 would have failed this job until Go 1.27.4 shipped.
  # A gate that fails on something the repo cannot act on gets disabled, and a
  # disabled gate reports nothing at all. So the findings are surfaced in the
  # step summary and the log, and the step does not fail the build. Promote to
  # failing once the toolchain-bump path is routine.
  #
  # `govulncheck` IS BUILT WITH THE REPO'S OWN TOOLCHAIN, not a pinned older
  # one. A govulncheck binary built with an older Go cannot analyse a newer
  # toolchain: locally, a go1.26-built binary refused a go1.27 module with a
  # load error, which is a check that silently stops checking. `setup-go` with
  # `go-version-file: go.mod` then `go install` guarantees they match.
  govulncheck:
    name: Reachability (govulncheck, report-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        id: govulncheck
        run: |
          set -o pipefail
          # Exit status is deliberately captured rather than propagated: 3
          # means findings, and findings are reported here, not fatal.
          govulncheck ./... > govulncheck.txt 2>&1 && rc=0 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat govulncheck.txt

          {
            echo "### govulncheck (reachability, report-only)"
            echo
            if [ "$rc" = "0" ]; then
              echo "No vulnerability is reachable from this module's code."
              echo
              echo "This says nothing about advisories with no CVE id: \`vuln.go.dev\` is CVE-keyed, and the five CVE-less go-jose advisories that were live in this module set are absent from it. Those are covered by \`scripts/check-pinned-modules.sh --gomod\`."
            else
              echo "govulncheck exited \`$rc\`. Findings below; a **called** finding is reachable from this code and worth acting on, an uncalled one is present but not reached."
              echo
              echo '```'
              # Bounded: a long report must not blow the 1 MB summary limit.
              head -c 60000 govulncheck.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-report
          path: govulncheck.txt
          if-no-files-found: warn

  mariadb:
    name: MariaDB integration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: caddyui_test
          MARIADB_USER: caddyui
          MARIADB_PASSWORD: test-password
          MARIADB_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MariaDB schema and migration tests
        env:
          CADDYUI_TEST_MARIADB_DSN: caddyui:test-password@tcp(127.0.0.1:3306)/caddyui_test
        run: go test ./internal/db -v

  # ---------------------------------------------------------------------------
  # pin-watch regression suites (T-0712).
  #
  # `go test ./...` cannot reach a shell script, so until this job existed the
  # only automated thing happening to check-pinned-modules.sh was
  # `shellcheck` — a ~3000-line script was linted on every push while none of
  # its behaviour was. The suites guarding it were hand-run only, and a
  # regression test nobody runs is a regression test that does not exist. The
  # cross-check suite in particular was written to fail on the pre-T-0666
  # predicate; that assertion is worth nothing unless something evaluates it
  # when the script changes.
  #
  # ONLY THE NETWORK-FREE SUITES RUN HERE. The other three make real
  # proxy/OSV/GitHub calls and take about a minute; more importantly their
  # result depends on the state of three external services, so a PR could go
  # red for a reason that has nothing to do with the PR. Those run on the
  # weekly caddy-image-refresh workflow, next to the live pin watch they
  # actually guard. Both halves run; neither is left unrun, which was the
  # state this fixes.
  #
  # `paths:` is deliberately NOT used to skip this job when the script is
  # untouched. It is ~1 second of runner time, and a filter that decides a
  # guard is unnecessary is one more place for the guard to silently not run.
  # ---------------------------------------------------------------------------
  pinwatch:
    name: Pin-watch regression suites (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper fails the job on a failing suite and raises a warning —
      # never a silent pass — on a skipped case. In `offline` mode a skip
      # should not be possible at all, so one appearing here is itself the
      # signal that a suite acquired a network dependency it should not have.
      - name: Run the network-free pin-watch suites
        run: ./scripts/run-pinwatch-suites.sh offline
