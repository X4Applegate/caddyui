# Publish docs/dockerhub.md as the Docker Hub repository overview.
# Manual only (Actions -> Publish Docker Hub overview -> Run workflow). Uses the
# same Docker Hub credentials as release-docker.yml: DOCKERHUB_USERNAME is a
# repository VARIABLE (a public namespace, not a secret - T-0777) and
# DOCKERHUB_TOKEN is a repository secret.
name: Publish Docker Hub overview

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Which Docker Hub repository overview to publish"
        type: choice
        options:
          - applegater/caddyui
          - applegater/caddyui-caddy
        default: applegater/caddyui

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish overview
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: ${{ inputs.repo }}
        run: scripts/dockerhub-description.sh publish
      - name: Show remaining drift (expect none)
        env:
          DOCKERHUB_REPO: ${{ inputs.repo }}
        run: scripts/dockerhub-description.sh diff
