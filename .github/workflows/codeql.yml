name: CodeQL

# v2.9.209: switch from GitHub default-setup to advanced setup so we can
# point at .github/codeql/codeql-config.yml and exclude the two queries
# whose findings are intentional design (TLS skip on probe clients, and
# user-driven outbound network requests). See that file for the rationale.
#
# Resolved (v2.9.225): merged with main's GitHub-generated `Create codeql.yml`
# (commit 64dee02) — kept our config-file path (the whole point of the PR),
# adopted main's v4 action versions and `packages: read` permission, kept
# Go-only since this project has no JS/TS source.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          # v2.9.225: keep parity with main's GitHub-generated workflow which
          # also scans javascript-typescript. The repo has one real .js
          # (web/static/sw.js, the PWA service worker) plus inline <script>
          # blocks in HTML templates. No build step needed for JS.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
