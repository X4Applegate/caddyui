# Publish the multi-arch (linux/amd64 + linux/arm64) Docker images to Docker Hub
# when a release tag is pushed:
#
#   applegater/caddyui         every release  -> :vX.Y.Z  :stable  :latest
#   applegater/caddyui-caddy   only when Dockerfile.caddy changed since the
#                              previous release tag (or when asked for by hand)
#
# The Caddy image is deliberately not rebuilt on every release: xcaddy fetches
# each plugin at its latest version, so a blind rebuild could silently bump
# plugins under everyone who pulls :stable. Its :vX.Y.Z tag names the CaddyUI
# release that last changed the module set.
#
# Setup, once, by a repo admin (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account that owns applegater/*  (applegater)
#   DOCKERHUB_TOKEN     Docker Hub access token, scope "Read & Write"
#                       (Docker Hub -> Account settings -> Personal access tokens)
# Until both secrets exist the workflow still builds both architectures, so a
# broken multi-arch build is caught, but it pushes nothing.
#
# Manual run (Actions -> Release Docker images -> Run workflow):
#   version  an existing tag such as v2.56.3 (blank = the branch you ran it on,
#            which can only ever be a build-only check)
#   push     off by default; on = publish to Docker Hub
#   caddy    also rebuild applegater/caddyui-caddy
#
# The build jobs hold the read/write DOCKERHUB_TOKEN, so every action and
# image this file names is pinned: actions to a full commit SHA (the release
# in the trailing comment), and the BuildKit, binfmt and SBOM-scanner images
# to a digest. The runner's own docker/buildx and the Dockerfiles' base
# images are outside these pins.
# Dependabot bumps the action SHAs but not the three image digests. Bump those
# by hand: resolve the moving tag the action would otherwise use, then check
# with `docker buildx imagetools inspect` that the versioned tag you write has
# the same digest:
#   moby/buildkit:buildx-stable-1          -> moby/buildkit:vX.Y.Z
#   tonistiigi/binfmt:latest               -> tonistiigi/binfmt:qemu-vX.Y.Z
#   docker/buildkit-syft-scanner:stable-1  -> docker/buildkit-syft-scanner:X.Y.Z
# Read `gh api repos/moby/buildkit/security-advisories` before moving BuildKit.
name: Release Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build, e.g. v2.56.3 (blank = this branch, build only)"
        required: false
        type: string
      push:
        description: "Push to Docker Hub (needs the secrets). Off = build only."
        required: false
        type: boolean
        default: false
      caddy:
        description: "Also rebuild applegater/caddyui-caddy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-docker-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.p.outputs.ref }}
      version: ${{ steps.p.outputs.version }}
      kind: ${{ steps.p.outputs.kind }}
      push: ${{ steps.p.outputs.push }}
      caddy: ${{ steps.p.outputs.caddy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Work out version, tags and whether to push
        id: p
        env:
          INPUT_VERSION: ${{ inputs.version }}
          WANT_PUSH: ${{ github.event_name == 'push' || inputs.push }}
          WANT_CADDY: ${{ inputs.caddy }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          stable_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          pre_re='^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'

          # Only a real release tag may publish. :stable and :latest move only
          # for a plain vX.Y.Z that is the newest release, so re-running an old
          # tag by hand can never roll them backwards; anything else gets just
          # its own :vX.Y.Z tag.
          kind=none
          if [[ "$version" =~ $stable_re ]]; then
            newest="$(git tag --list 'v*' | grep -E "$stable_re" | sort -V | tail -1)"
            if [ "$version" = "$newest" ]; then kind=stable; else kind=older; fi
          elif [[ "$version" =~ $pre_re ]]; then kind=pre
          else version=dev
          fi

          push=false
          if [ "$kind" != none ] && [ "$WANT_PUSH" = "true" ]; then
            if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
              push=true
            else
              echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set - building both architectures but not pushing."
            fi
          fi

          # Rebuild the Caddy image when asked, or when Dockerfile.caddy differs
          # from the previous release tag (nearest tag before this commit).
          caddy=false
          if [ "$WANT_CADDY" = "true" ]; then
            caddy=true
          elif [ "$kind" != none ]; then
            prev="$(git describe --tags --abbrev=0 "${version}^" 2>/dev/null || true)"
            if [ -z "$prev" ]; then
              caddy=true
            elif ! git diff --quiet "$prev" "$version" -- Dockerfile.caddy; then
              caddy=true
            fi
          fi

          # Only the version and release kind cross to the build jobs — never the
          # image names. GitHub silently DROPS any job output that contains the
          # value of a secret, and "applegater" is the DOCKERHUB_USERNAME secret,
          # so a tag list like applegater/caddyui:v1.2.3 would arrive empty
          # ("tag is needed when pushing to registry"). Each build job builds its
          # own tags from these two values instead.
          {
            echo "ref=${INPUT_VERSION:-$GITHUB_REF}"
            echo "version=$version"
            echo "kind=$kind"
            echo "push=$push"
            echo "caddy=$caddy"
          } >> "$GITHUB_OUTPUT"

          echo "version=$version kind=$kind push=$push caddy=$caddy"

  caddyui:
    name: applegater/caddyui
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}

      # The Dockerfile cross-compiles on the runner's own architecture, so no
      # QEMU is needed for the arm64 image. The BuildKit image is the release
      # that buildx-stable-1 pointed at when pinned.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to Docker Hub
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out image tags
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          KIND: ${{ needs.plan.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          repo=applegater/caddyui
          {
            echo "TAGS<<EOF"
            echo "$repo:$VERSION"
            if [ "$KIND" = stable ]; then
              echo "$repo:stable"
              echo "$repo:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      # `sbom: true` would run docker/buildkit-syft-scanner:stable-1, a moving
      # tag, inside this BuildKit, so the scanner is named by digest instead.
      - name: Build (and push) linux/amd64 + linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
          tags: ${{ env.TAGS }}
          push: ${{ needs.plan.outputs.push == 'true' }}
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

      - name: Verify every pushed tag is one multi-arch image
        if: needs.plan.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          first=""
          while read -r tag; do
            [ -n "$tag" ] || continue
            out="$(docker buildx imagetools inspect "$tag")"
            for plat in linux/amd64 linux/arm64; do
              grep -Eq "Platform:[[:space:]]+${plat}\$" <<<"$out" || { echo "::error::$tag is missing $plat"; exit 1; }
            done
            digest="$(awk '/^Digest:/{print $2; exit}' <<<"$out")"
            first="${first:-$digest}"
            [ "$digest" = "$first" ] || { echo "::error::$tag digest $digest differs from $first"; exit 1; }
            echo "ok  $tag  $digest"
          done <<<"$TAGS"

  caddy:
    name: applegater/caddyui-caddy
    needs: plan
    if: needs.plan.outputs.caddy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}

      # Caddy itself still cross-compiles natively; QEMU only runs the final
      # stage's `apk upgrade` inside the arm64 alpine image. The binfmt image
      # runs privileged, hence its digest pin. It is pulled every time rather
      # than restored from the Actions cache, which the action falls back to
      # when a pull fails.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to Docker Hub
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out image tags
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          KIND: ${{ needs.plan.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          repo=applegater/caddyui-caddy
          {
            echo "TAGS<<EOF"
            echo "$repo:$VERSION"
            if [ "$KIND" = stable ]; then
              echo "$repo:stable"
              echo "$repo:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build (and push) linux/amd64 + linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.caddy
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.TAGS }}
          push: ${{ needs.plan.outputs.push == 'true' }}
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

      - name: Verify every pushed tag is one multi-arch image
        if: needs.plan.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          first=""
          while read -r tag; do
            [ -n "$tag" ] || continue
            out="$(docker buildx imagetools inspect "$tag")"
            for plat in linux/amd64 linux/arm64; do
              grep -Eq "Platform:[[:space:]]+${plat}\$" <<<"$out" || { echo "::error::$tag is missing $plat"; exit 1; }
            done
            digest="$(awk '/^Digest:/{print $2; exit}' <<<"$out")"
            first="${first:-$digest}"
            [ "$digest" = "$first" ] || { echo "::error::$tag digest $digest differs from $first"; exit 1; }
            echo "ok  $tag  $digest"
          done <<<"$TAGS"
