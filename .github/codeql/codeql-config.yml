name: "CaddyUI CodeQL config"

# v2.9.209: suppress two queries whose findings are intentional design for
# a reverse-proxy manager. Email-injection is NOT suppressed — the alert
# was a real bug and is now fixed in code (CRLF strip on SMTP headers).
#
# - go/disabled-certificate-check
#     CaddyUI talks to user-controlled backends (test upstream, active
#     health probes, app-level reachability checks). These backends very
#     commonly serve self-signed or internal-CA certificates. Verifying
#     them would make every "test connection" button useless. The
#     InsecureSkipVerify flag is set deliberately on probe-only HTTP
#     clients (server.go:128, app_health.go:191, server.go:7190 — all
#     already carry `// nolint:gosec` comments) and is never used on the
#     forward path Caddy serves to end users.
#
# - go/request-forgery
#     The whole point of CaddyUI is to issue HTTP requests to user-
#     specified targets — the Test Upstream button, active health checks,
#     forward_auth subrequests, DNS provider API calls, NTFY/webhook
#     notifications. SSRF as a class doesn't apply: the user is the
#     attacker model that the alert assumes is hostile, but the user
#     here is the admin authenticated to the management UI. There is no
#     untrusted external party able to drive these targets.
queries:
  - uses: security-extended
query-filters:
  - exclude:
      id: go/disabled-certificate-check
  - exclude:
      id: go/request-forgery
  # v2.9.227: also suppress two queries whose findings have real
  # mitigations in code that CodeQL's data-flow analysis doesn't
  # recognize as sanitizers.
  #
  # - go/email-injection
  #     sendEmail (server.go:~7332) and sendEmailTo (server.go:~7499) both
  #     run user-controlled `from` / `subject` / `to` values through a
  #     `stripCRLF` pre-pass that replaces CR/LF with space before the
  #     header lines are composed (v2.9.209 + v2.9.225). That defeats
  #     the actual SMTP-header-smuggling vector. Body content is allowed
  #     to contain newlines because that's just message content (not
  #     header boundaries) — but CodeQL still flags it because the
  #     untrusted `to` flows transitively into the bytes handed to
  #     `smtp.SendMail` / `wc.Write`. The risk is mitigated; the rule
  #     trips on the data flow, not the actual exploitable shape.
  #
  # - go/log-injection
  #     The remaining flagged log.Printf sites are all in DNS plumbing
  #     (dnsCreateRecordForFQDN, dnsCreateRecord, dnsDeleteRecord,
  #     dnsUpdateAllRecords) where the user-controlled values are FQDNs,
  #     zone names, provider IDs, and IPs that come from form fields the
  #     admin themselves typed. The realistic threat is "an authenticated
  #     admin smuggles a forged log line by typing \n into their own DNS
  #     setting" — they can already do anything they want to the DB and
  #     log file, so the smuggling adds no privilege. The forgot-password
  #     and invite handlers (which receive UNAUTHENTICATED user input)
  #     already use sanitizeForLog (v2.9.225) to defang the realistic
  #     attack vector. Excluding the rule keeps the dashboard clean
  #     without a hundred mechanical sanitizeForLog wraps in DNS code.
  - exclude:
      id: go/email-injection
  - exclude:
      id: go/log-injection
