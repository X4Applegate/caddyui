{{define "title"}}Caddy Config · CaddyUI{{end}}
{{define "content"}}
<div class="mb-6 flex items-start justify-between gap-4">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight text-ink-900">Live Caddy Config</h1>
    <p class="text-sm text-ink-500 mt-1">Current JSON config loaded in Caddy. Read-only — edit proxy hosts/routes to make changes.</p>
  </div>
  <button onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('caddy-json').textContent).then(function(){var b=document.getElementById('copy-btn');b.textContent='Copied!';setTimeout(function(){b.textContent='Copy JSON'},2000)})" id="copy-btn"
    class="inline-flex items-center gap-1.5 bg-white border border-ink-200 hover:bg-ink-50 text-ink-700 text-sm font-medium px-4 py-2 rounded-lg transition shrink-0">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
    Copy JSON
  </button>
</div>

{{if .Error}}
<div data-toast="error" class="bg-red-50 border border-red-200 rounded-xl px-5 py-3 mb-5 text-sm text-red-700">{{.Error}}</div>
{{else}}
<div class="bg-white border border-ink-200 rounded-xl shadow-card overflow-hidden">
  <div class="flex items-center justify-between px-4 py-2 bg-ink-50 border-b border-ink-100">
    <span class="text-xs font-medium text-ink-500 font-mono">Caddy JSON</span>
    <span class="text-xs text-ink-400">Fetched live from admin API</span>
  </div>
  <pre id="caddy-json" class="p-4 text-xs font-mono text-ink-700 overflow-x-auto whitespace-pre max-h-[70vh] overflow-y-auto leading-relaxed">{{.ConfigJSON}}</pre>
</div>
{{end}}
{{end}}
